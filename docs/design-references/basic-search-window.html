<div id="aevia-basic-search" aria-label="Basic Search window design">
  <div class="previewbar"><span>Basic Search · candidate design · example data</span><button type="button" class="cursor-interaction" id="bs-add">＋ New search window</button></div>
  <div id="bs-windows"></div>
  <dialog id="bs-detail"><form method="dialog"><button class="cursor-interaction close" aria-label="Close details">Close</button></form><div id="bs-detail-body"></div></dialog>
</div>
<style>
#aevia-basic-search{color-scheme:light dark;--bs-bg:light-dark(#f7f7f5,#222425);--bs-sheet:light-dark(#fff,#2b2e30);--bs-ink:light-dark(#252a2d,#edf0f0);--bs-muted:light-dark(#59616a,#b2babf);--bs-line:light-dark(#ccd1d4,#50565b);--bs-chrome:light-dark(#e6e9eb,#343a40);--bs-active:light-dark(#264e67,#93bfd9);--bs-on-active:light-dark(#fff,#142532);--bs-tint:light-dark(#edf4f8,#293e4b);font:14px/1.45 "Segoe UI",sans-serif;color:var(--bs-ink);}
#aevia-basic-search *{box-sizing:border-box;}#aevia-basic-search button,#aevia-basic-search input,#aevia-basic-search select{font:inherit;color:var(--bs-ink);}
#aevia-basic-search button{border:1px solid var(--bs-line);border-radius:4px;background:var(--bs-sheet);padding:6px 12px;white-space:normal;}#aevia-basic-search button:hover:not(:disabled){background:var(--bs-tint);}#aevia-basic-search button:disabled{opacity:.45;}#aevia-basic-search button.primary{background:var(--bs-active);color:var(--bs-on-active);border-color:var(--bs-active);}
#aevia-basic-search input:not([type=checkbox]),#aevia-basic-search select{width:100%;padding:6px 8px;border:1px solid var(--bs-line);background:var(--bs-sheet);border-radius:3px;min-width:0;}#aevia-basic-search input[type=checkbox]{accent-color:var(--bs-active);width:16px;height:16px;vertical-align:middle;}
#aevia-basic-search .previewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-right:95px;color:var(--bs-muted);font-size:12px;}
#aevia-basic-search .window{background:var(--bs-bg);border:1px solid var(--bs-line);border-radius:7px;overflow:hidden;margin-bottom:20px;}
#aevia-basic-search .titlebar{background:var(--bs-chrome);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}.bs-title{font-weight:500;}#aevia-basic-search .small{font-size:12px;color:var(--bs-muted);}#aevia-basic-search .titlebar button{padding:2px 9px;}
#aevia-basic-search .section{padding:16px 18px;}#aevia-basic-search .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}#aevia-basic-search .section-title{font-weight:500;}#aevia-basic-search .criteria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;}#aevia-basic-search label.field{display:block;}#aevia-basic-search label.field>span{display:block;margin-bottom:4px;font-size:12px;color:var(--bs-muted);}#aevia-basic-search .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}#aevia-basic-search .tags-field{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;}#aevia-basic-search .date-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}#aevia-basic-search .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;}#aevia-basic-search .toolbar .small{margin-left:auto;}#aevia-basic-search .clipboard-offer{background:var(--bs-tint);padding:10px 12px;margin-top:12px;border-radius:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}#aevia-basic-search .clipboard-offer span{flex:1;min-width:150px;}
#aevia-basic-search .arc-options{margin-top:12px;}#aevia-basic-search .arc-options summary{font-weight:500;}#aevia-basic-search .arc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}#aevia-basic-search .neighbor{display:grid;grid-template-columns:70px 1fr;gap:8px;}
#aevia-basic-search .results-section{background:var(--bs-sheet);border-top:1px solid var(--bs-line);border-bottom:1px solid var(--bs-line);}#aevia-basic-search table{width:100%;border-collapse:collapse;}#aevia-basic-search th{text-align:left;font-weight:500;color:var(--bs-muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--bs-line);}#aevia-basic-search td{padding:11px 10px;border-bottom:1px solid var(--bs-line);vertical-align:top;overflow-wrap:anywhere;}#aevia-basic-search tbody tr:last-child td{border-bottom:0;}#aevia-basic-search tr.selected{background:var(--bs-tint);}#aevia-basic-search .object-title{font-weight:500;}#aevia-basic-search .tag{display:inline-block;background:var(--bs-chrome);padding:1px 5px;border-radius:3px;font-size:12px;margin:1px 3px 1px 0;}#aevia-basic-search .checkcol{width:32px;}#aevia-basic-search .uuid{font:12px/1.4 Consolas,monospace;overflow-wrap:anywhere;}#aevia-basic-search .empty{padding:25px 10px;color:var(--bs-muted);}
#aevia-basic-search .actionrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}#aevia-basic-search .actionrow .small{margin-left:auto;}#aevia-basic-search .name-editor{margin-top:12px;padding:12px;background:var(--bs-sheet);border:1px solid var(--bs-line);border-radius:4px;}#aevia-basic-search .binding-row{display:grid;grid-template-columns:minmax(0,1fr) 140px;align-items:center;gap:12px;margin:8px 0;}#aevia-basic-search .status{margin-top:12px;min-height:20px;color:var(--bs-muted);font-size:12px;}#aevia-basic-search .compact td{padding-top:6px;padding-bottom:6px;}#aevia-basic-search dialog{background:var(--bs-sheet);color:var(--bs-ink);border:1px solid var(--bs-line);border-radius:7px;max-width:min(560px,90%);padding:22px;}#aevia-basic-search dialog::backdrop{background:#0006;}#aevia-basic-search .close{float:right;}#aevia-basic-search [hidden]{display:none!important;}
@media(max-width:620px){#aevia-basic-search .criteria,#aevia-basic-search .arc-fields{grid-template-columns:1fr;}#aevia-basic-search .section{padding:12px;}#aevia-basic-search .tags-col,#aevia-basic-search .date-col{display:none;}#aevia-basic-search td,#aevia-basic-search th{padding-left:6px;padding-right:6px;}#aevia-basic-search .previewbar{padding-right:0;}#aevia-basic-search .binding-row{grid-template-columns:1fr;}#aevia-basic-search .toolbar .small{margin-left:0;}#aevia-basic-search .actionrow .small{margin-left:0;}}
@media(pointer:coarse){#aevia-basic-search button,#aevia-basic-search input:not([type=checkbox]),#aevia-basic-search select{min-height:44px;}}
</style>
<script>
(()=>{
const root=document.getElementById('aevia-basic-search');
const objects=[
{id:'7426b7cb-e477-4d88-8f41-d4ecdb06fc10',type:'arc',name:'coastal-move',title:'Moving to the coast',tags:['home','change'],date:'2024-06',end:'2024-09',description:'A passage of finding a new home and settling into it.'},
{id:'75b90263-bd8c-4a01-a56a-5ca0c3deeff1',type:'arc',name:'learning-the-coast',title:'Learning the coast',tags:['home','learning'],date:'2024-09',end:'ongoing',description:'Becoming familiar with the place and the people around it.'},
{id:'8ea17281-5247-47ce-8f0e-b8d535aeaa25',type:'arc',name:'job-search',title:'Looking for the next job',tags:['work','change'],date:'2024-08',end:'2025-01',description:'Seeking a new role after the move.'},
{id:'b4f7c502-fefd-49a5-bbeb-45d6fce453b1',type:'event',name:'interview-invitation',title:'An invitation to interview',tags:['work'],date:'2024-11-08',description:'A message inviting me to discuss a possible role.'},
{id:'fa06c318-2c70-4a4b-b23f-a2d4d9e850b0',type:'journal-entry',name:'first-week-reflections',title:'Notes from the first week',tags:['home'],date:'2024-09-12',description:'Writing about what felt familiar, what felt strange, and what I wanted to remember.'},
{id:'a5b937a1-d6c3-4618-9f1d-ef9ff19cac22',type:'event',name:'keys-collected',title:'Collected the keys',tags:['home','change'],date:'2024-08-30',description:'The day I could finally enter the new place.'}
];
const defaults=()=>({type:'all',name:'',title:'',tags:'',tagMode:'all',from:'',to:'',relation:'none',distance:'3',unit:'months'});
let windows=[],seq=0,clipboard=null,bindings={},design={showUUID:false,compact:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'Basic Search: parameters, results, selection actions',windowCount:windows.length},privateContent:{windows:windows.map(w=>({id:w.id,spec:w.spec,applied:w.applied,selected:[...w.selected]})),bindings,clipboard,seq}}).catch(()=>{});}
function matches(o,s){const tags=s.tags.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);return(s.type==='all'||o.type===s.type)&&o.name.toLowerCase().includes(s.name.toLowerCase())&&o.title.toLowerCase().includes(s.title.toLowerCase())&&(!tags.length||(s.tagMode==='all'?tags.every(t=>o.tags.includes(t)):tags.some(t=>o.tags.includes(t))))&&(!s.from||o.date>=s.from)&&(!s.to||o.date<=s.to);}
function selectedObjects(w){return objects.filter(o=>w.selected.has(o.id));}
function status(w,text){w.el.querySelector('.status').textContent=text;}
function readSpec(w){const s={};w.el.querySelectorAll('[data-field]').forEach(e=>s[e.dataset.field]=e.value);w.spec={...defaults(),...s};return w.spec;}
function writeSpec(w){w.el.querySelectorAll('[data-field]').forEach(e=>e.value=w.spec[e.dataset.field]??'');w.el.querySelector('.arc-options').hidden=w.spec.type!=='arc';}
function offers(){for(const w of windows){const box=w.el.querySelector('.clipboard-offer');box.hidden=!clipboard;if(clipboard){box.querySelector('span').textContent=clipboard.kind==='search'?'A search is on the demo clipboard.':clipboard.kind==='range'?'A temporal range is on the demo clipboard.':'Object references are on the demo clipboard.';box.querySelector('[data-do=reset-clip]').hidden=clipboard.kind==='objects';box.querySelector('[data-do=incorporate-clip]').hidden=clipboard.kind==='objects';}}}
function resultTable(w){const rows=objects.filter(o=>matches(o,w.applied));w.visible=rows;w.selected=new Set([...w.selected].filter(id=>rows.some(o=>o.id===id)));w.el.querySelector('.results-count').textContent=`${rows.length} results`;w.el.querySelector('tbody').innerHTML=rows.length?rows.map(o=>`<tr class="${w.selected.has(o.id)?'selected':''}" data-id="${o.id}"><td class="checkcol"><input type="checkbox" aria-label="Select ${esc(o.title)}" data-select="${o.id}" ${w.selected.has(o.id)?'checked':''}></td><td><div class="object-title">${esc(o.title)}</div><div class="small">${esc(o.name)}${Object.entries(bindings).filter(([n,id])=>id===o.id).map(([n])=>` · session: ${esc(n)}`).join('')}</div>${design.showUUID?`<div class="uuid">${o.id}</div>`:''}</td><td>${o.type}</td><td class="tags-col">${o.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</td><td class="date-col">${o.date}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No matches for this search.</td></tr>';updateActions(w);}
function updateActions(w){const sel=selectedObjects(w);w.el.querySelector('.selected-count').textContent=`${sel.length} selected`;for(const b of w.el.querySelectorAll('[data-needs-selection]'))b.disabled=!sel.length;w.el.querySelector('[data-do=open]').disabled=sel.length!==1;w.el.querySelector('[data-do=name]').textContent=sel.length>1?'Name selected objects…':'Name selected object…';w.el.querySelector('[data-do=copy-objects]').textContent=sel.length>1?'Copy selected references':'Copy reference';w.el.querySelector('[data-do=select-all]').checked=Boolean(w.visible.length)&&w.visible.every(o=>w.selected.has(o.id));}
function naming(w){const sel=selectedObjects(w);const box=w.el.querySelector('.name-editor');box.hidden=false;box.innerHTML=`<div class="section-title">Session names</div>${sel.map((o,i)=>`<label class="binding-row"><span>${esc(o.title)}<span class="small"> · ${o.type}</span></span><input aria-label="Session name for ${esc(o.title)}" data-bind="${o.id}" placeholder="${sel.length>1?String.fromCharCode(97+i):'a'}"></label>`).join('')}<div class="toolbar"><button class="primary cursor-interaction" data-do="bind">Assign names</button><button class="cursor-interaction" data-do="cancel-name">Cancel</button><span class="small">Session names shadow Basic names.</span></div>`;}
function createWindow(state){seq=state?.id?Math.max(seq,state.id):seq+1;const id=state?.id||seq;const w={id,spec:{...defaults(),...state?.spec},applied:{...defaults(),...state?.applied},selected:new Set(state?.selected||[])};const el=document.createElement('section');el.className='window';el.setAttribute('aria-label',`Basic Search ${id}`);w.el=el;el.innerHTML=`
<div class="titlebar"><span class="bs-title">Basic Search · ${id}</span><span class="small">Independent query &amp; results</span><button type="button" class="cursor-interaction" data-do="close-window" aria-label="Close search window ${id}">×</button></div>
<div class="section"><div class="section-head"><span class="section-title">Search parameters</span><button type="button" class="cursor-interaction" data-do="copy-search">Copy search</button></div>
<div class="criteria"><label class="field"><span>Object type</span><select data-field="type"><option value="all">All Basic objects</option><option value="arc">Arcs</option><option value="event">Events</option><option value="journal-entry">Journal entries</option></select></label><label class="field"><span>Name contains</span><input data-field="name" placeholder="Part of a Basic name"></label><label class="field"><span>Title contains</span><input data-field="title" placeholder="Part of a display title"></label><label class="field"><span>Tags</span><span class="tags-field"><input data-field="tags" placeholder="work, change"><select data-field="tagMode" aria-label="Tag matching"><option value="all">All tags</option><option value="any">Any tag</option></select></span></label></div>
<details class="arc-options" hidden><summary>Arc timing</summary><div class="arc-fields"><label class="field"><span>Reference range</span><span class="date-pair"><input data-field="from" aria-label="Range beginning" placeholder="Beginning"><input data-field="to" aria-label="Range ending" placeholder="Ending"></span></label><label class="field"><span>Relationship to range</span><select data-field="relation"><option value="none">No temporal constraint</option><option value="overlap">Overlaps this range</option><option value="near">Neighbors this range</option></select></label><label class="field"><span>Neighboring distance</span><span class="neighbor"><input data-field="distance" type="number" min="0" aria-label="Distance"><select data-field="unit"><option>days</option><option>months</option><option>years</option><option>decades</option></select></span></label></div></details>
<div class="toolbar"><button class="primary cursor-interaction" data-do="search">Search</button><button class="cursor-interaction" data-do="clear">Clear parameters</button><span class="small dirty" aria-live="polite">Results match the current parameters.</span></div>
<div class="clipboard-offer" hidden><span></span><button class="cursor-interaction" data-do="reset-clip">Reset to clipboard search</button><button class="cursor-interaction" data-do="incorporate-clip">Incorporate…</button></div></div>
<div class="section results-section"><div class="section-head"><span class="section-title">Results</span><span class="small results-count" aria-live="polite"></span></div><table aria-label="Search results"><thead><tr><th class="checkcol"><input type="checkbox" aria-label="Select all results" data-do="select-all"></th><th>Title / Basic name</th><th>Type</th><th class="tags-col">Tags</th><th class="date-col">Basic date</th></tr></thead><tbody></tbody></table></div>
<div class="section"><div class="section-head"><span class="section-title">With selected objects</span><span class="selected-count small" aria-live="polite">0 selected</span></div><div class="actionrow"><button class="cursor-interaction" data-do="open" disabled>Open selected</button><button class="cursor-interaction" data-do="name" data-needs-selection disabled>Name selected object…</button><button class="cursor-interaction" data-do="copy-objects" data-needs-selection disabled>Copy reference</button></div><div class="name-editor" hidden></div><div class="status" aria-live="polite"></div></div>`;
root.querySelector('#bs-windows').append(el);windows.push(w);writeSpec(w);resultTable(w);offers();el.classList.toggle('compact',design.compact);
el.addEventListener('input',e=>{if(e.target.matches('[data-field]')){readSpec(w);el.querySelector('.arc-options').hidden=w.spec.type!=='arc';el.querySelector('.dirty').textContent='Parameters changed · press Search to refresh results.';persist();}});
el.addEventListener('change',e=>{if(e.target.dataset.select){e.target.checked?w.selected.add(e.target.dataset.select):w.selected.delete(e.target.dataset.select);el.querySelector('.name-editor').hidden=true;resultTable(w);persist();}});
el.addEventListener('click',e=>{const action=e.target.closest('[data-do]')?.dataset.do;if(!action)return;
if(action==='search'){readSpec(w);w.applied={...w.spec};w.selected.clear();resultTable(w);el.querySelector('.name-editor').hidden=true;el.querySelector('.dirty').textContent='Results match the current parameters.';status(w,w.spec.relation!=='none'?'Arc interval matching is a proposed control; this demo filters Basic fields only.':'');}
if(action==='clear'){w.spec=defaults();writeSpec(w);el.querySelector('.dirty').textContent='Parameters cleared · press Search to refresh results.';}
if(action==='copy-search'){clipboard={kind:'search',spec:{...readSpec(w)}};offers();status(w,'Search definition copied to demo clipboard.');}
if(action==='reset-clip'&&clipboard){w.spec={...defaults(),...(clipboard.spec||{})};writeSpec(w);el.querySelector('.dirty').textContent='Clipboard search loaded · press Search to run.';status(w,'Current criteria replaced.');}
if(action==='incorporate-clip'&&clipboard?.spec){const incoming=clipboard.spec;const current=readSpec(w);const conflicts=Object.keys(incoming).filter(k=>incoming[k]&&incoming[k]!==defaults()[k]&&current[k]!==defaults()[k]&&current[k]!==incoming[k]);if(conflicts.length){status(w,`Incorporation needs a decision for: ${conflicts.join(', ')}. Existing criteria retained.`);}else{for(const [k,v]of Object.entries(incoming))if(v!==defaults()[k]&&v!=='')current[k]=v;w.spec=current;writeSpec(w);el.querySelector('.dirty').textContent='Criteria incorporated · press Search to run.';status(w,'Clipboard criteria added; previous filters retained.');}}
if(action==='select-all'){if(e.target.checked)w.visible.forEach(o=>w.selected.add(o.id));else w.selected.clear();el.querySelector('.name-editor').hidden=true;resultTable(w);}
if(action==='name')naming(w);
if(action==='cancel-name')el.querySelector('.name-editor').hidden=true;
if(action==='bind'){const fields=[...el.querySelectorAll('[data-bind]')];const values=fields.map(i=>({name:i.value.trim(),id:i.dataset.bind}));const names=values.map(v=>v.name);if(names.some(n=>!n)||new Set(names).size!==names.length){status(w,'Give each selected object a distinct, nonempty session name.');return;}const collision=values.find(v=>bindings[v.name]&&bindings[v.name]!==v.id);if(collision){status(w,`Session name “${collision.name}” is already bound. Rebinding needs an explicit choice.`);return;}values.forEach(v=>bindings[v.name]=v.id);el.querySelector('.name-editor').hidden=true;windows.forEach(resultTable);status(w,`Assigned ${names.join(', ')} for this demo session.`);}
if(action==='copy-objects'){const ids=[...w.selected];clipboard={kind:'objects',ids,text:JSON.stringify(ids)};offers();status(w,`${w.selected.size} UUID reference${w.selected.size===1?'':'s'} copied as a JSON list of strings to the demo clipboard.`);}
if(action==='open'){const o=selectedObjects(w)[0];if(o){root.querySelector('#bs-detail-body').innerHTML=`<h3>${esc(o.title)}</h3><p>${esc(o.description)}</p><p class="small">${esc(o.type)} · ${esc(o.name)}</p><p class="uuid">${o.id}</p>`;root.querySelector('#bs-detail').showModal();}}
if(action==='close-window'){el.remove();windows=windows.filter(x=>x!==w);}
persist();});return w;
}
function applyState(saved){if(!saved?.windows?.length)return false;bindings=saved.bindings||{};clipboard=saved.clipboard||null;seq=saved.seq||0;root.querySelector('#bs-windows').replaceChildren();windows=[];saved.windows.forEach(createWindow);return true;}
if(!applyState(window.openai?.widgetState?.privateContent))createWindow();
root.querySelector('#bs-add').addEventListener('click',()=>{createWindow();persist();});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{for(const w of windows){w.el.classList.toggle('compact',design.compact);resultTable(w);}}});tweak.addToggle(design,'showUUID',{label:'Show full UUIDs in results'});tweak.addToggle(design,'compact',{label:'Compact result rows'});}
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(saved)applyState(saved);});
})();
</script>
